---
# process-compose.override.yaml — UNMANAGED, project-owned.
#
# process-compose merges this file over the generated process-compose.yaml with
# no extra flags. Project-specific processes live here so seihou template
# upgrades never overwrite them. Docs: https://f1bonacc1.github.io/process-compose/merge/

version: "0.5"
processes:
  # Project-local lifecycle scripts use a private container and port block.
  # The broker remains available after process-compose exits; stop it explicitly
  # with `just redpanda-down` to preserve its data.
  redpanda:
    command: redpanda-local-up
    availability:
      restart: "no"

  jaeger:
    command: jaeger --config=file:.dev/jaeger-config.yaml
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 16686
        path: /
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 2
      failure_threshold: 15
    availability:
      restart: on_failure
